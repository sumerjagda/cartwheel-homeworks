name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Run checks that do not call a model
        run: uv run --frozen pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Install Harbor 0.23.0
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate classified Harbor tasks
        run: uv run --frozen python scripts/export_harbor_tasks.py
      - name: Run Harbor evaluations (5 attempts per case)
        run: |
          PYTHONPATH="$PWD" harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --n-concurrent 3 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes
      - name: Summarize Harbor job and enforce CI gate
        if: always()
        run: |
          uv run --frozen python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --expected-attempts 5
      - name: Upload Harbor job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
