name: hw6-harbor-runner

on:
  push:
    branches: [hw6]

jobs:
  harbor-smoke:
    name: Harbor 1-case smoke check (e-001)
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Install Harbor 0.23.0
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check configuration (non-secret)
        run: |
          echo "CARTWHEEL_MODEL=${CARTWHEEL_MODEL:-<UNSET>}"
          test -n "${CARTWHEEL_MODEL:-}" || { echo "ERROR: CARTWHEEL_MODEL repository variable is not set"; exit 1; }
          test -n "${GEMINI_API_KEY:-}" || { echo "ERROR: GEMINI_API_KEY repository secret is not set"; exit 1; }
          echo "GEMINI_API_KEY is configured (non-empty)"
      - name: Export baseline task e-001
        run: uv run --frozen python scripts/export_harbor_tasks.py --baseline --case e-001
      - name: Run Harbor 1-case smoke check
        run: |
          PYTHONPATH="$PWD" harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 1 \
            --job-name hw6-smoke-e001 \
            --jobs-dir .harbor/jobs \
            --yes
      - name: Summarize smoke check and inspect diagnostics
        if: always()
        run: |
          uv run --frozen python - << 'EOF'
          import json
          from pathlib import Path

          job_dir = Path(".harbor/jobs/hw6-smoke-e001")
          result_path = job_dir / "result.json"
          if not result_path.exists():
              print("No result.json found; listing job_dir:")
              for p in sorted(job_dir.rglob("*")) if job_dir.exists() else []:
                  print(" ", p)
              raise SystemExit(0)

          data = json.loads(result_path.read_text())
          trials = data.get("trial_results", [])
          print(f"Trials count: {len(trials)}")
          for t in trials:
              print("TASK:", t.get("task_name"), "TRIAL:", t.get("trial_name"))
              print("  REWARDS:", (t.get("verifier_result") or {}).get("rewards"))
              print("  EXCEPTION:", t.get("exception_info"))
              print("  AGENT_INFO:", t.get("agent_info"))
          for log_file in sorted(job_dir.rglob("verifier*")):
              if log_file.is_file() and log_file.stat().st_size < 30000:
                  print(f"\n--- {log_file} ---")
                  print(log_file.read_text(errors="replace")[:4000])
          for log_file in sorted(job_dir.rglob("cartwheel-result.json")):
              if log_file.is_file():
                  print(f"\n--- {log_file} ---")
                  d = json.loads(log_file.read_text())
                  print("FINAL_REPLY:", d.get("transcript", {}).get("final_reply", "")[:500])
          EOF
      - name: Upload Harbor smoke job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-smoke-e001
          path: .harbor/jobs/hw6-smoke-e001
          if-no-files-found: warn
