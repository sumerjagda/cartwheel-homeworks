name: hw6-harbor-runner

on:
  push:
    branches: [hw6]

jobs:
  harbor-baseline-e004:
    name: Harbor 5-attempt baseline (e-004)
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Install Harbor 0.23.0
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export baseline task e-004
        run: uv run --frozen python scripts/export_harbor_tasks.py --baseline --case e-004
      - name: Run Harbor baseline for e-004 (5 attempts)
        run: |
          PYTHONPATH="$PWD" harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --n-concurrent 2 \
            --job-name hw6-baseline-e004 \
            --jobs-dir .harbor/jobs \
            --yes
      - name: Summarize baseline for e-004
        if: always()
        run: |
          uv run --frozen python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-baseline-e004 \
            --expected-attempts 5 \
            --classify
      - name: Upload Harbor baseline e-004 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-baseline-e004
          path: .harbor/jobs/hw6-baseline-e004
          if-no-files-found: warn
